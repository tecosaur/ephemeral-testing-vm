name: Upterm runner

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Select runner OS'
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      limit_to_actor:
        description: 'Limit SSH access to my GitHub SSH keys'
        required: false
        type: boolean
        default: true

jobs:
  vm:
    runs-on: ${{ github.event.inputs.os }}
    steps:
      - uses: julia-actions/setup-julia@v3

      - name: Start upterm session
        uses: owenthereal/action-upterm@v1
        with:
          # v0.30 moved session sockets; action-upterm v1.15 only detects the
          # v0.29 layout (see owenthereal/action-upterm#36). Unpin once merged.
          upterm-version: v0.29.0
          wait-timeout-minutes: 15
          limit-access-to-actor: ${{ inputs.limit_to_actor }}
